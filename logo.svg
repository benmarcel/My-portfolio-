<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold gradient matching your portfolio -->
    <linearGradient id="portfolioGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f4d03f"/>
    </linearGradient>
    
    <!-- Dark gradient for depth -->
    <linearGradient id="darkGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>

    <!-- Radial glow effect -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer glow -->
  <circle cx="60" cy="60" r="58" fill="url(#glow)"/>

  <!-- Outer circle (dark background) -->
  <circle cx="60" cy="60" r="56" fill="#141414" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="52" fill="url(#darkGlow)" opacity="0.6"/>

  <!-- Code brackets (gold) -->
  <path d="M30 40 L18 60 L30 80" 
        stroke="url(#portfolioGold)" 
        stroke-width="6" 
        stroke-linecap="round" 
        fill="none"
        opacity="0.9"/>
  <path d="M90 40 L102 60 L90 80" 
        stroke="url(#portfolioGold)" 
        stroke-width="6" 
        stroke-linecap="round" 
        fill="none"
        opacity="0.9"/>

  <!-- Paint brush (center) -->
  <rect x="56" y="30" width="8" height="34" rx="4" fill="#ffffff" opacity="0.95"/>
  <rect x="54" y="60" width="12" height="10" rx="2" fill="#e6e6e6"/>

  <!-- Brush tip (Netflix red accent) -->
  <path d="M50 74 Q60 88 70 74 Q60 96 50 74" fill="#E50914"/>

  <!-- Small gear (top right - gold) -->
  <g transform="translate(80 26) scale(0.5)">
    <circle cx="20" cy="20" r="16" fill="url(#portfolioGold)" opacity="0.2"/>
    <path d="M20 4 
             L24 10 
             L32 12 
             L28 20 
             L32 28 
             L24 30 
             L20 36 
             L16 30 
             L8 28 
             L12 20 
             L8 12 
             L16 10 Z"
          fill="url(#portfolioGold)"/>
    <circle cx="20" cy="20" r="6" fill="#1f1f1f"/>
  </g>

  <!-- Sparkle effects (optional cinematic touch) -->
  <circle cx="25" cy="25" r="2" fill="#d4af37" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="95" cy="85" r="1.5" fill="#d4af37" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>